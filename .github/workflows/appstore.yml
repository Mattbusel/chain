name: App Store

# The whole pipeline on a rented Mac. Nothing here needs a Mac in anyone's
# hands: GitHub provides the runner, the App Store Connect API key does the
# authenticating, and the signing identity is imported from a secret.
#
# Every step below that looks over-specified is one that cost a CI cycle to
# learn on the previous app in this account, and is commented as such.

on:
  workflow_dispatch:
    inputs:
      action:
        description: "What to do"
        required: true
        default: compile
        type: choice
        options:
          - compile       # build + unit tests, ~3 min, no simulator screenshots
          - dry_run       # build, sign, upload; do not submit
          - release       # everything, including submit for review

jobs:
  ship:
    runs-on: macos-15
    timeout-minutes: 90

    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
      DEVELOPMENT_TEAM: ${{ secrets.DEVELOPMENT_TEAM }}
      FASTLANE_SKIP_UPDATE_CHECK: "1"
      FASTLANE_HIDE_CHANGELOG: "1"
      LC_ALL: en_US.UTF-8
      LANG: en_US.UTF-8

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26
        run: |
          # Not hardcoded to /Applications/Xcode_26.app: that path exists on the
          # runner image but is a stub with no Contents/Developer inside, so
          # selecting it fails while `ls` lists it happily. The real installs are
          # the point releases. Newest wins, so a runner image update cannot
          # strand the build on an SDK Apple no longer accepts.
          chosen=""
          for app in $(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -Vr); do
            if [ -d "$app/Contents/Developer" ]; then chosen="$app"; break; fi
          done
          if [ -z "$chosen" ]; then
            echo "no usable Xcode 26:"; ls /Applications | grep -i xcode; exit 1
          fi
          echo "using $chosen"
          sudo xcode-select -s "$chosen/Contents/Developer"
          xcodebuild -version

      - name: Install xcodegen and fastlane
        run: |
          brew install xcodegen
          gem install fastlane --no-document

      - name: Pick an available simulator
        run: |
          # Not hardcoded. The runner image does not always carry the same
          # simulators, and a device name that worked on six runs failed on the
          # seventh with "Unable to find a device matching the provided
          # destination specifier", which reads like a project problem rather
          # than a fleet one. Newest available iPhone wins.
          name=$(xcrun simctl list devices available \
                 | grep -oE "iPhone [0-9]+ Pro Max" | sort -Vr | head -1)
          if [ -z "$name" ]; then
            name=$(xcrun simctl list devices available \
                   | grep -oE "iPhone [0-9]+ Pro" | sort -Vr | head -1)
          fi
          if [ -z "$name" ]; then
            echo "no iPhone simulator on this runner:"
            xcrun simctl list devices available
            exit 1
          fi
          echo "using simulator: $name"
          echo "SIM_NAME=$name" >> "$GITHUB_ENV"

      - name: Generate the Xcode project
        run: xcodegen generate

      - name: Compile
        run: |
          set -o pipefail
          xcodebuild build -project Chain.xcodeproj -scheme Chain             -destination "platform=iOS Simulator,name=$SIM_NAME" CODE_SIGNING_ALLOWED=NO | xcpretty

      - name: Write the signing key to disk
        if: ${{ inputs.action == 'dry_run' || inputs.action == 'release' }}
        run: |
          # xcodebuild reads the key from a file path, not an environment
          # variable. RUNNER_TEMP is wiped with the job and is outside the
          # checkout, so it cannot be committed by accident.
          echo "$ASC_KEY_CONTENT" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          chmod 600 "$RUNNER_TEMP/AuthKey.p8"
          echo "ASC_KEY_PATH=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"

      - name: Import the signing certificate
        if: ${{ inputs.action == 'dry_run' || inputs.action == 'release' }}
        env:
          DIST_CERT_P12: ${{ secrets.DIST_CERT_P12 }}
          DIST_CERT_PASSWORD: ${{ secrets.DIST_CERT_PASSWORD }}
        run: |
          # Imported, never created. Generating a certificate on a runner leaves
          # its private key on a machine that is about to be destroyed, so Apple
          # keeps a certificate nobody can ever use again, and Apple caps how
          # many of those an account may hold.
          keychain="$RUNNER_TEMP/signing.keychain-db"
          security create-keychain -p "" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "" "$keychain"
          echo "$DIST_CERT_P12" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security import "$RUNNER_TEMP/dist.p12" -k "$keychain" \
            -P "$DIST_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          # Without the partition list, codesign blocks on a GUI prompt that
          # nobody can answer and the job hangs until it times out.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          security default-keychain -s "$keychain"
          rm -f "$RUNNER_TEMP/dist.p12"
          security find-identity -v -p codesigning "$keychain"

      - name: Build, upload and submit
        if: ${{ inputs.action == 'dry_run' || inputs.action == 'release' }}
        run: fastlane ${{ inputs.action }}

      - name: Keep the logs
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: logs
          path: |
            ~/Library/Logs/gym
            fastlane/report.xml
          if-no-files-found: ignore
